[package]
name = "osfs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Hostitelsky nastroj pro souborovy system MagnumOpus: format, check, ls/cat/put a pripojeni ve Windows pres WinFsp"

[dependencies]
fs = { workspace = true, features = ["std"] }
# Stejna knihovna a verze jako v `libs/fs` (NFC tvar ulozenych jmen).
unicode-normalization = { version = "0.1", default-features = false }

[dev-dependencies]
proptest = "1"
