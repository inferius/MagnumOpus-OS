# Server SSH: jen nasloucha na portu 22 (init omezi relaci site) a pro
# kazde spojeni spusti `sshd-conn` (docs/cs/ssh.md).
[app]
id = "org.magnumopus.sshd"
name = "Vzdálený přístup (SSH)"

[limits]
memory = "8M"
kernel_memory = "2M"
stack = "256K"

[network]
rights = ["info", "tcp", "listen"]
sockets = 32
buffers = "2M"
