[package]
name = "compd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "compd"
test = false
bench = false

[dependencies]
libos = { path = "../../libs/libos" }
guiproto = { path = "../../libs/guiproto" }
inputproto = { path = "../../libs/inputproto" }
comp = { path = "../../libs/comp" }
gfx = { path = "../../libs/gfx" }
theme = { path = "../../libs/theme" }
bootsplash = { path = "../../libs/bootsplash" }
# Stav site a hlasitosti v liste (jen formaty zprav, cteni bez blokovani).
netproto = { path = "../../libs/netproto" }
audioproto = { path = "../../libs/audioproto" }
# Rezy Interu, ktere kompozitor kresli (titulky, odznak, lista, dialogy).
font = { path = "../../libs/font", features = ["inter-400", "inter-500", "inter-600", "inter-700"] }
venus = { path = "../../libs/venus", features = ["os"] }
vkcomp = { path = "../../libs/vkcomp", features = ["os"] }
accountproto = { path = "../../libs/accountproto" }
wire = { path = "../../libs/wire" }
bufdesc = { path = "../../libs/bufdesc" }
yuv = { path = "../../libs/yuv" }
