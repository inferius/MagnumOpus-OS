[package]
name = "dnsd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dnsd"
test = false
bench = false

[dependencies]
libos = { path = "../../libs/libos" }
netproto = { path = "../../libs/netproto", features = ["client"] }
fsproto = { path = "../../libs/fsproto" }
tls = { path = "../../libs/tls", features = ["libos"] }
httpc = { path = "../../libs/httpc" }
web = { path = "../../libs/web" }
dns = { path = "../../libs/dns" }
conf = { workspace = true }
