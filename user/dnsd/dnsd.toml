# Sifrovane resolvery v poradi (po chybe dalsi, pak se drzi funkcniho):
#   doh:https://jmeno/cesta@adresa      DNS over HTTPS (RFC 8484, port 443)
#   dot:jmeno@adresa[:port]             DNS over TLS (RFC 7858, port 853)
# Adresa je povinna: dnsd jmena resolveru nepreklada; jmeno overuje
# certifikat.
servers = [
    "doh:https://cloudflare-dns.com/dns-query@1.1.1.1",
    "doh:https://dns.quad9.net/dns-query@9.9.9.9",
    "dot:one.one.one.one@1.0.0.1",
    "dot:dns.quad9.net@149.112.112.112",
]
# Overeni DNSSEC v dnsd (odpovedim resolveru se neveri).
dnssec = true
# Korenove kotvy (DS korene "tag algoritmus typ otisk") podle IANA
# root-anchors.xml: KSK-2017 a KSK-2024 (podepisuje koren od 2026-10).
trust_anchors = [
