[package]
name = "vk-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vk-probe"
test = false
bench = false

[dependencies]
libos = { path = "../../libs/libos" }
venus = { path = "../../libs/venus", features = ["os"] }
vkcomp = { path = "../../libs/vkcomp", features = ["os"] }
gfx = { path = "../../libs/gfx" }
guiproto = { path = "../../libs/guiproto" }
spirv = { path = "../../libs/spirv" }
yuv = { path = "../../libs/yuv" }
