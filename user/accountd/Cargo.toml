[package]
name = "accountd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "accountd"
test = false
bench = false

[features]
default = []
# Rezim vyvojare (`src/devmode.rs`): jen vyvojove sestaveni, zapina ho
# xtask pro obrazy s vyvojovym profilem. Ve vydani kod neni.
dev-mode = ["accountproto/dev-mode", "guiproto/dev-mode"]

[dependencies]
libos = { path = "../../libs/libos" }
fsproto = { path = "../../libs/fsproto" }
conf = { workspace = true }
wire = { path = "../../libs/wire" }
# Otisk klice SSH do logu (bez protokolu).
ssh = { path = "../../libs/ssh" }
guiproto = { path = "../../libs/guiproto" }
accountproto = { path = "../../libs/accountproto" }
accounts = { path = "../../libs/accounts" }
rand_core = { version = "0.6", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
