[package]
name = "init"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "init"
test = false
bench = false

[features]
default = []
# Rezim vyvojare: jen predani prikazu `devmode` sluzbe uctu. Jen vyvojove
# sestaveni, zapina ho xtask pro obrazy s vyvojovym profilem.
dev-mode = ["powerproto/dev-mode", "accountproto/dev-mode"]

[dependencies]
installplan = { workspace = true }
# Barvy vzhledu v testech GUI (stejne tokeny jako kompozitor).
theme = { path = "../../libs/theme" }
# Test determinismu startovniho obrazu (sada displej).
bootsplash = { path = "../../libs/bootsplash" }
libos = { path = "../../libs/libos" }
blockproto = { path = "../../libs/blockproto" }
fsproto = { path = "../../libs/fsproto" }
launchproto = { path = "../../libs/launchproto" }
inputproto = { path = "../../libs/inputproto" }
guiproto = { path = "../../libs/guiproto" }
renderproto = { path = "../../libs/renderproto" }
bufdesc = { path = "../../libs/bufdesc" }
yuv = { path = "../../libs/yuv" }
netproto = { path = "../../libs/netproto", features = ["client"] }
# Testovaci terminal pro termios (sada cstd).
ttyproto = { path = "../../libs/ttyproto" }
manifest = { path = "../../libs/manifest" }
conf = { workspace = true }
spin = "0.12"
svcclient = { path = "../../libs/svcclient", features = ["client"] }
shlang = { path = "../../libs/shlang" }
powerproto = { path = "../../libs/powerproto" }
abi = { workspace = true }
term = { path = "../../libs/term" }
audioproto = { path = "../../libs/audioproto", features = ["client"] }
mediaproto = { path = "../../libs/mediaproto", features = ["client"] }
audiomix = { path = "../../libs/audiomix" }
accountproto = { path = "../../libs/accountproto", features = ["client"] }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
agentproto = { path = "../../libs/agentproto" }
wire = { path = "../../libs/wire" }
taskproto = { path = "../../libs/taskproto" }
notifyproto = { path = "../../libs/notifyproto" }
fileops = { path = "../../libs/fileops" }
openwith = { path = "../../libs/openwith" }
