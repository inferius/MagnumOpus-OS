# Spravce souboru (milnik 6c): prochazeni, operace, kos, verze. Kopirovani
# dela pomocny proces files-copy (prezije zavreni okna).
[app]
id = "org.magnumopus.files"
name = "Soubory"
system = true

[limits]
memory = "96M"

[window]
instances = "multi"

# Asociace typu (libs/openwith): slozky otevira spravce souboru; soubor,
# ktery zadna aplikace neotevre, spravce ukaze (vybere ve slozce).
[open]
action = "files.show"
folders = true
reveal = true

[[action]]
id = "files.show"
title = "Ukázat cestu ve správci souborů"

[[action.param]]
name = "path"
type = "path"
required = true

[[action]]
id = "files.new-folder"
title = "Nová složka"

[[action]]
id = "files.rename"
title = "Přejmenovat vybranou položku"

[[action]]
id = "files.trash"
title = "Vybrané položky do koše"

[[action]]
id = "files.copy"
title = "Kopírovat vybrané položky"

[[action]]
id = "files.cut"
title = "Vyjmout vybrané položky"

[[action]]
id = "files.paste"
title = "Vložit do aktuální složky"

[[action]]
id = "files.back"
title = "Zpět"

[[action]]
id = "files.up"
title = "Nahoru do nadřazené složky"

[[action]]
id = "files.refresh"
title = "Znovu načíst složku"

[[action]]
id = "files.properties"
title = "Vlastnosti a oprávnění vybrané položky"
