[package]
name = "ld"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Zavadec sdilenych knihoven ld.so (static-PIE, docs/cs/dynamicke-linkovani.md)"

[[bin]]
name = "ld"
test = false
bench = false

[dependencies]
# Bez vlastniho runtime libos (vstup, heap a panic handler ma zavadec svuj).
libos = { path = "../../libs/libos", default-features = false, features = ["libd"] }
abi.workspace = true
elf.workspace = true
dynload = { path = "../../libs/dynload" }
libdproto = { path = "../../libs/libdproto" }
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }
