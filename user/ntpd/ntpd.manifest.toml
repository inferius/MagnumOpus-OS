# Klient NTP a NTS. Cile site urci init podle seznamu serveru v ntpd.toml
# (TCP na NTS-KE, UDP na NTP); manifest dava jen prava.
[app]
id = "org.magnumopus.ntpd"
name = "Synchronizace casu"

[limits]
# TLS pro NTS-KE (kryptografie, korenove CA).
memory = "24M"
kernel_memory = "2M"
stack = "512K"

[network]
rights = ["info", "tcp", "udp", "dns"]
sockets = 8
buffers = "1M"
