[package]
name = "shsess"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "shsess"
test = false
bench = false

[features]
default = []
# Prikaz `devmode` (rezim vyvojare): jen vyvojove sestaveni, zapina ho
# xtask pro obrazy s vyvojovym profilem.
dev-mode = ["term/dev-mode", "shlang/dev-mode", "powerproto/dev-mode"]

[dependencies]
installplan = { workspace = true }
libos = { path = "../../libs/libos" }
fsproto = { path = "../../libs/fsproto" }
shlang = { path = "../../libs/shlang" }
term = { path = "../../libs/term" }
audioproto = { path = "../../libs/audioproto", features = ["client"] }
audiomix = { path = "../../libs/audiomix" }
agentproto = { path = "../../libs/agentproto" }
agentsh = { path = "../../libs/agentsh" }
wire = { path = "../../libs/wire" }
powerproto = { path = "../../libs/powerproto" }
openwith = { path = "../../libs/openwith" }
launchproto = { path = "../../libs/launchproto" }
spin = "0.12"
