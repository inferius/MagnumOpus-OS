[workspace]
resolver = "3"
members = [
    "loader",
    "kernel",
    "libs/abi",
    "libs/boot-info",
    "libs/conf",
    "libs/dns",
    "libs/elf",
    "libs/fs",
    "libs/fsproto",
    "libs/netfilter",
    "libs/netproto",
    "libs/osfs-proto",
    "libs/httpc",
    "libs/initfs",
    "libs/manifest",
    "libs/blockproto",
    "libs/inputproto",
    "libs/guiproto",
    "libs/svcclient",
    "libs/taskproto",
    "libs/taskview",
    "libs/gfx",
    "libs/font",
    "libs/vgpu",
    "libs/comp",
    "libs/ui",
    "libs/keymap",
    "libs/i8042",
    "libs/usbproto",
    "libs/usbclient",
    "libs/csprng",
    "libs/libos",
    "libs/pci",
    "libs/tls",
    "libs/tz",
    "libs/shlang",
    "libs/term",
    "libs/virtio",
    "libs/web",
    "libs/wire",
    "tools/osfs",
    "user/console",
    "user/devmgr",
    "user/echo",
    "user/svctest",
    "user/fsrtest",
    "user/fsd",
    "user/fwd",
    "user/netd",
    "user/netprobe",
    "user/ntpd",
    "user/fetch",
    "user/revocd",
    "user/dnsd",
    "user/init",
    "user/ps2",
    "user/shsess",
    "user/inputd",
    "user/termd",
    "user/timed",
    "user/virtio-blk",
    "user/virtio-input",
    "user/xhci",
    "user/usb-hub",
    "user/usb-hid",
    "user/virtio-net",
    "user/virtio-rng",
    "user/virtio-gpu",
    "user/compd",
    "user/gui-demo",
    "user/gui-term",
    "user/gui-tasks",
    "xtask",
]
# Na hostiteli se standardne buildi jen xtask. Loader, kernel a userspace
# maji vlastni targety a builduje je `cargo xtask build`.
default-members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
abi = { path = "libs/abi" }
boot-info = { path = "libs/boot-info" }
conf = { path = "libs/conf" }
elf = { path = "libs/elf" }
initfs = { path = "libs/initfs" }
tz = { path = "libs/tz" }
fs = { path = "libs/fs" }

[profile.dev]
panic = "abort"

# Interpret shellu je rekurzivni; bez optimalizace by jedna uroven volani
# zabrala ~50 KB zasobniku (s optimalizaci ~6 KB). Program ma 256 KB.
# Souborovy system: bez optimalizace trva zapis radku shellu v debug ~5 s
# a test velkeho adresare kolem 90 s (B+strom, soucty, komprese).
[profile.dev.package.fs]
opt-level = 2

[profile.dev.package.fsd]
opt-level = 2

[profile.dev.package.fsproto]
opt-level = 2
[profile.dev.package.blockproto]
opt-level = 2
[profile.dev.package."virtio-blk"]
opt-level = 2
[profile.dev.package.virtio]
opt-level = 2

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.shlang]
opt-level = 2

[profile.dev.package.term]
opt-level = 2

# Skladani a rasterizace bez optimalizace by byly desetkrat pomalejsi
# (pixelove smycky); kompozitor by nestihal takt snimku.
[profile.dev.package.guiproto]
opt-level = 2

[profile.dev.package.gfx]
opt-level = 2

[profile.dev.package.font]
opt-level = 2

[profile.dev.package.comp]
opt-level = 2

[profile.dev.package.ui]
opt-level = 2

# Kryptografie TLS: bez optimalizace je handshake v QEMU (TCG) o rad
# pomalejsi (skalarni nasobeni na krivce, RSA) a testy by vyprsely.
[profile.dev.package.tls]
opt-level = 3

[profile.dev.package.rustls]
opt-level = 3

[profile.dev.package."rustls-webpki"]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package."aes-gcm"]
opt-level = 3

[profile.dev.package.ghash]
opt-level = 3

[profile.dev.package.polyval]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package."curve25519-dalek"]
opt-level = 3

[profile.dev.package."x25519-dalek"]
opt-level = 3

[profile.dev.package."ed25519-dalek"]
opt-level = 3

[profile.dev.package.p256]
opt-level = 3

[profile.dev.package.p384]
opt-level = 3

[profile.dev.package.primeorder]
opt-level = 3

[profile.dev.package."elliptic-curve"]
opt-level = 3

[profile.dev.package."crypto-bigint"]
opt-level = 3

[profile.dev.package.ecdsa]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package."num-bigint-dig"]
opt-level = 3

[profile.release]
panic = "abort"
debug = true
