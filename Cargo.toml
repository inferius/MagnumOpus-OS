[workspace]
resolver = "3"
members = [
    "loader",
    "kernel",
    "libs/abi",
    "libs/boot-info",
    "libs/conf",
    "libs/elf",
    "libs/fs",
    "libs/fsproto",
    "libs/netfilter",
    "libs/netproto",
    "libs/osfs-proto",
    "libs/initfs",
    "libs/manifest",
    "libs/blockproto",
    "libs/csprng",
    "libs/libos",
    "libs/pci",
    "libs/tz",
    "libs/virtio",
    "libs/wire",
    "tools/osfs",
    "user/devmgr",
    "user/echo",
    "user/fsd",
    "user/fwd",
    "user/netd",
    "user/netprobe",
    "user/init",
    "user/timed",
    "user/virtio-blk",
    "user/virtio-net",
    "user/virtio-rng",
    "xtask",
]
# Na hostiteli se standardne buildi jen xtask. Loader, kernel a userspace
# maji vlastni targety a builduje je `cargo xtask build`.
default-members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
abi = { path = "libs/abi" }
boot-info = { path = "libs/boot-info" }
conf = { path = "libs/conf" }
elf = { path = "libs/elf" }
initfs = { path = "libs/initfs" }
tz = { path = "libs/tz" }
fs = { path = "libs/fs" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
