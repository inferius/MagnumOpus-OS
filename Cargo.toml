[workspace]
resolver = "3"
members = [
    "loader",
    "kernel",
    "libs/abi",
    "libs/boot-info",
    "libs/elf",
    "libs/fs",
    "libs/fsproto",
    "libs/osfs-proto",
    "libs/initfs",
    "libs/blockproto",
    "libs/inputproto",
    "libs/keymap",
    "libs/i8042",
    "libs/usbproto",
    "libs/usbclient",
    "libs/libos",
    "libs/pci",
    "libs/tz",
    "libs/shlang",
    "libs/term",
    "libs/virtio",
    "tools/osfs",
    "user/devmgr",
    "user/echo",
    "user/fsd",
    "user/init",
    "user/ps2",
    "user/inputd",
    "user/termd",
    "user/timed",
    "user/virtio-blk",
    "user/virtio-input",
    "user/xhci",
    "user/usb-hub",
    "user/usb-hid",
    "xtask",
]
# Na hostiteli se standardne buildi jen xtask. Loader, kernel a userspace
# maji vlastni targety a builduje je `cargo xtask build`.
default-members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
abi = { path = "libs/abi" }
boot-info = { path = "libs/boot-info" }
elf = { path = "libs/elf" }
initfs = { path = "libs/initfs" }
tz = { path = "libs/tz" }
fs = { path = "libs/fs" }

[profile.dev]
panic = "abort"

# Interpret shellu je rekurzivni; bez optimalizace by jedna uroven volani
# zabrala ~50 KB zasobniku (s optimalizaci ~6 KB). Program ma 256 KB.
[profile.dev.package.shlang]
opt-level = 2

[profile.dev.package.term]
opt-level = 2

[profile.release]
panic = "abort"
debug = true
