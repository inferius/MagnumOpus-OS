# Na hostiteli se standardne buildi jen xtask. Loader, kernel a userspace
# maji vlastni targety a builduje je `cargo xtask build`.
default-members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
abi = { path = "libs/abi" }
boot-info = { path = "libs/boot-info" }
crashrec = { path = "libs/crashrec" }
qr = { path = "libs/qr" }
fatw = { path = "libs/fatw" }
installplan = { path = "libs/installplan" }
conf = { path = "libs/conf" }
elf = { path = "libs/elf" }
initfs = { path = "libs/initfs" }
tz = { path = "libs/tz" }
fs = { path = "libs/fs" }

[profile.dev]
panic = "abort"

# Interpret shellu je rekurzivni; bez optimalizace by jedna uroven volani
# zabrala ~50 KB zasobniku (s optimalizaci ~6 KB). Program ma 256 KB.
[profile.dev.package.shlang]
opt-level = 2

# Jadro i v debug obrazu optimalizovane (debug-assertions zustavaji): bez
# optimalizace byly kopie zprav kanalu ~5 MB/s a prvni mapovani okna souboru
# 16 MiB trvalo 2,2 s misto 0,16 s (docs/cs/sestaveni.md). Krokovani jadra
# v gdb bez optimalizace: `cargo xtask run --gdb --kernel-opt 0`.
[profile.dev.package.kernel]
opt-level = 2

[profile.dev.package.term]
opt-level = 2

# Souborovy system: hashe bloku (XXH3, BLAKE3), komprese a strom CoW. Bez
# optimalizace je kazdy pozadavek i krok scrubu, defragmentace
# a deduplikace na pozadi v QEMU (TCG) mnohonasobne pomalejsi; radek
# shellu se zapisem pak cekal sekundy (klon, diff, zahozeni, krok scrubu
# mezi pozadavky).
[profile.dev.package.fs]
opt-level = 2

[profile.dev.package.fsd]
opt-level = 2

# Zavislosti fsd na ceste kazdeho pozadavku (kanal, alokator, kodovani
# zprav): bez optimalizace bylo cteni ve fsd v debug obrazu radove
# pomalejsi nez v release (mereni Wine: nacitani .so/PE).
[profile.dev.package.libos]
opt-level = 2
[profile.dev.package.wire]
opt-level = 2
[profile.dev.package.svcclient]
opt-level = 2
[profile.dev.package.sizeclass]
opt-level = 2
[profile.dev.package.linked_list_allocator]
opt-level = 2

[profile.dev.package.fsproto]
opt-level = 2
[profile.dev.package.blockproto]
opt-level = 2
[profile.dev.package."virtio-blk"]
opt-level = 2
[profile.dev.package.virtio]
opt-level = 2

[profile.dev.package.xxhash-rust]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.lz4_flex]
opt-level = 3

[profile.dev.package.ruzstd]
opt-level = 3

# Skladani a rasterizace bez optimalizace by byly desetkrat pomalejsi
# (pixelove smycky); kompozitor by nestihal takt snimku.
[profile.dev.package.guiproto]
opt-level = 2

[profile.dev.package.gfx]
opt-level = 2

[profile.dev.package.font]
opt-level = 2

# Startovni obraz: pixelove smycky (proces splash, prvni snimek kompozitoru).
[profile.dev.package.bootsplash]
opt-level = 2

[profile.dev.package.comp]
opt-level = 2

[profile.dev.package.ui]
opt-level = 2

# Kryptografie TLS: bez optimalizace je handshake v QEMU (TCG) o rad
# pomalejsi (skalarni nasobeni na krivce, RSA) a testy by vyprsely.
[profile.dev.package.tls]
opt-level = 3

[profile.dev.package.rustls]
opt-level = 3

[profile.dev.package."rustls-webpki"]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package."aes-gcm"]
opt-level = 3

[profile.dev.package.ghash]
opt-level = 3

[profile.dev.package.polyval]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

# Ucty: Argon2id (BLAKE2b) bez optimalizace by v QEMU
# (TCG) zdrzely kazde prihlaseni o sekundy.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.accounts]
opt-level = 2

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package."curve25519-dalek"]
opt-level = 3

[profile.dev.package."x25519-dalek"]
opt-level = 3

[profile.dev.package."ed25519-dalek"]
opt-level = 3

# SSH (libs/ssh, sunset): vymena klicu ML-KEM + x25519 a sifra v kazdem
# paketu; bez optimalizace trva handshake v debug obrazu i testech minuty.
[profile.dev.package.sunset]
opt-level = 2

[profile.dev.package.ml-kem]
opt-level = 2

[profile.dev.package.module-lattice]
opt-level = 2

[profile.dev.package.keccak]
opt-level = 2

[profile.dev.package.sha3]
opt-level = 2

[profile.dev.package.p256]
opt-level = 3

[profile.dev.package.p384]
opt-level = 3

[profile.dev.package.primeorder]
opt-level = 3

[profile.dev.package."elliptic-curve"]
opt-level = 3

[profile.dev.package."crypto-bigint"]
opt-level = 3

[profile.dev.package.ecdsa]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package."num-bigint-dig"]
opt-level = 3

[profile.release]
panic = "abort"
debug = true

# getrandom 0.4.3 s backendem pro `target_os = "magnumopus"` (syscall
# `RANDOM_GET`): stejna zaplata jako u portu std
# (`third_party/ports/getrandom-0.4.3.patch`), zde pro programy workspace
# (sunset v `libs/ssh`). Az bude cil v upstream, patch odpadne.
[patch.crates-io]
getrandom = { path = "third_party/crates/getrandom-0.4.3" }
# sunset 0.6.0 (SSH, `libs/ssh`) s doplnky: viz THIRD-PARTY.md, kapitola SSH.
sunset = { path = "third_party/crates/sunset-0.6.0" }
