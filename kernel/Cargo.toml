[package]
name = "kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kernel"
test = false
bench = false

[dependencies]
abi.workspace = true
boot-info.workspace = true
elf.workspace = true
initfs.workspace = true
csprng = { path = "../libs/csprng" }
spin = "0.12"
noto-sans-mono-bitmap = { version = "0.4", default-features = false, features = ["regular", "size_16", "size_24", "unicode-basic-latin", "unicode-latin-1-supplement", "unicode-latin-extended-a", "unicode-specials"] }

[features]
# Po self-testech ukonci QEMU pres isa-debug-exit (cargo xtask test).
qemu-test = []
# Prelozi i zaznamy urovne Trace v release buildu.
log-trace = []
