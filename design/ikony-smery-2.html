<style>
/* Druhe kolo ikon: pastelove a barevnejsi smery (D, E, F). Kategorie maji
 * vlastni dvojici barev (pastel + syta), tri motivy vedle sebe pres tridy .th-*. */
.page { max-width: 1400px; }
.dir { margin-top: var(--s9); }
.why { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--s4); margin: var(--s3) 0 var(--s4); font-size: var(--t-small-size); }
.why .card h3 { margin: 0 0 var(--s2); font-size: var(--t-body-size); }
.why ul { margin: 0; padding-left: 18px; }
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s4); }
.panel { border-radius: var(--r-card); border: 1px solid var(--c-border); background: var(--c-bg); color: var(--c-ink); padding: var(--s4); min-width: 0; }
.panel.th-contrast { border: 2px solid #fff; }
.panel h4 { margin: 0 0 var(--s3); font-size: var(--t-caption-size); color: var(--c-ink-muted); text-transform: uppercase; letter-spacing: .06em; }
.igrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s1); }
.igrid div { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: var(--s2) 0; font-size: 10px; color: var(--c-ink-muted); text-align: center; }
.sizes { display: flex; gap: var(--s4); align-items: flex-end; margin: var(--s4) 0; padding: var(--s3); border-radius: var(--r-control); background: var(--c-surface); }
.apps { display: flex; gap: var(--s3); flex-wrap: wrap; margin-bottom: var(--s4); }
.apps figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: var(--c-ink-muted); }
.ctx-bar { display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: var(--r-card); background: var(--c-surface); border: 1px solid var(--c-border); }
.ctx-bar .b { width: 34px; height: 34px; display: grid; place-items: center; border-radius: var(--r-control); }
.ctx-bar .b.on { background: var(--c-accent-soft); }
.ctx-bar .sp { flex: 1; } .ctx-bar .sep { width: 1px; height: 20px; background: var(--c-border); }
.ctx-title { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px; margin-top: var(--s3); border-radius: var(--r-card) var(--r-card) 0 0; background: var(--c-surface-2); border: 1px solid var(--c-border); border-bottom: 0; font-size: 12px; font-weight: 600; }
.ctx-title .badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px 0 6px; border-radius: var(--r-badge); background: var(--c-trust-bg); color: var(--c-trust-ink); border: 1px solid var(--c-trust-border); font-size: 11px; }
.ctx-title .nm { flex: 1; text-align: center; }
.ctx-list { border: 1px solid var(--c-border); border-radius: 0 0 var(--r-card) var(--r-card); background: var(--c-surface); padding: 4px; }
.ctx-list .r { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 8px; border-radius: var(--r-control); font-size: 12px; }
.ctx-list .r.sel { background: var(--c-accent-soft); }
.ctx-list .r .m { margin-left: auto; color: var(--c-ink-muted); font-size: 11px; }
.legend { display: flex; gap: var(--s4); flex-wrap: wrap; font-size: var(--t-small-size); margin-top: var(--s3); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 16px; border-radius: 5px; display: inline-block; }
@media (max-width: 1100px) { .themes { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<a class="skip" href="#main">Přeskočit na obsah</a>
<div id="proto"></div>
<main id="main" class="page">
  <header>
    <h1>Ikony: barevné směry (2. kolo)</h1>
    <p class="lead">Barevnější, ale klidné: každá kategorie má svou pastelovou barvu a k ní sytější odstín téže barvy pro kresbu. Žádná duha v jedné ikoně, žádný černý obrys. Tři způsoby, jak barvu použít, na stejném vzorku. Původní směry A-C jsou v <a href="ikony-smery.html">1. kole</a>.</p>
    <div class="legend" id="legend"></div>
  </header>
  <div id="dirs"></div>
</main>
<script>
document.addEventListener('mo-ready', function () {
  var T = window.MO_TOKENS;
  // Kategorie: [pastel, syta] pro svetly, tmavy, kontrast. Koralova je jen agent;
  // broskvova se nepouziva (patri odznaku duvery).
  var CAT = {
    soubory: { n: 'soubory a úložiště', light: ['#ffe9a8', '#8a5000'], dark: ['#4a3a12', '#f2c46b'], contrast: ['transparent', '#ffe14d'] },
    system: { n: 'systém a zabezpečení', light: ['#e4daff', '#5027bd'], dark: ['#3a2d5c', '#d8c9ff'], contrast: ['transparent', '#e6b0ff'] },
    sit: { n: 'síť a komunikace', light: ['#d3e5ff', '#2350c4'], dark: ['#1d3358', '#9bbcff'], contrast: ['transparent', '#9fc2ff'] },
    zarizeni: { n: 'zařízení a média', light: ['#ccefdc', '#1b7543'], dark: ['#173826', '#7fdca5'], contrast: ['transparent', '#7dff9e'] },
    cas: { n: 'čas a verze', light: ['#c8eef1', '#0b6878'], dark: ['#123c42', '#6fd6e3'], contrast: ['transparent', '#66f0ff'] },
    agent: { n: 'agent (vyhrazeno)', light: ['#ffe4ea', '#9c1b3d'], dark: ['#4a1d2a', '#ffc2cf'], contrast: ['transparent', '#ff8fb0'] }
  };
  var ORDER = ['soubory', 'system', 'sit', 'zarizeni', 'cas', 'agent'];
  var C2 = { soubory: 'sit', system: 'sit', sit: 'cas', zarizeni: 'cas', cas: 'zarizeni', agent: 'system' }; // druha barva prechodu
  var CATOF = { folder: 'soubory', file: 'soubory', disk: 'soubory', trash: 'soubory', settings: 'system', terminal: 'system', apps: 'system', shieldcheck: 'system',
    lock: 'system', user: 'system', tasks: 'sit', bell: 'sit', search: 'sit', wifi: 'sit', volume: 'zarizeni', battery: 'zarizeni', camera: 'zarizeni', history: 'cas', branch: 'cas', agent: 'agent', globe: 'sit' };

  var css = '';
  ['light', 'dark', 'contrast'].forEach(function (th) {
    css += '.th-' + th + '{';
    Object.keys(T.color[th]).forEach(function (k) { css += '--c-' + k.replace(/_/g, '-') + ':' + T.color[th][k] + ';'; });
    css += '}';
  });
  document.head.insertAdjacentHTML('beforeend', '<style>' + css + '</style>');
  // Prechody pro smer F: pastel kategorie -> pastel sousedni kategorie.
  var defs = '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>';
  ['light', 'dark'].forEach(function (th) {
    ORDER.forEach(function (c) {
      defs += '<linearGradient id="gr-' + c + '-' + th + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + CAT[c][th][0] + '"/><stop offset="1" stop-color="' + CAT[C2[c]][th][0] + '"/></linearGradient>';
    });
  });
  document.body.insertAdjacentHTML('beforeend', defs + '</defs></svg>');
  document.getElementById('legend').innerHTML = ORDER.map(function (c) { return '<span><i style="background:' + CAT[c].light[0] + ';box-shadow:inset 0 0 0 2px ' + CAT[c].light[1] + '"></i>' + CAT[c].n + '</span>'; }).join('');

  function sym(n) { return window.MO_ICON_LINE(n); }
  var I = [
    ['folder', 'složka', 'b', '<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/>',
      '<path d="M3 8a3 3 0 0 1 3-3h3.6a2 2 0 0 1 1.4.6L12.5 7H18a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/>'],
    ['file', 'soubor', 'b', '<path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>',
      '<path d="M8 3h5.6a2 2 0 0 1 1.4.6l3.4 3.4a2 2 0 0 1 .6 1.4V18a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/><path d="M14 3.5V7a1.5 1.5 0 0 0 1.5 1.5H19"/>'],
    ['settings', 'nastavení', 'a', '<circle cx="12" cy="12" r="7"/>', null],
    ['terminal', 'terminál', 'a', '<rect x="3" y="4" width="18" height="16" rx="3"/>', '<rect x="3" y="4" width="18" height="16" rx="4.5"/><path d="M7.5 9.5l2.5 2.5-2.5 2.5M12.5 15H16.5"/>'],
    ['tasks', 'úlohy', 'a', '<rect x="3" y="4" width="5" height="16" rx="2"/>', null],
    ['bell', 'oznámení', 'a', '<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/>', '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.2 1.6a.9.9 0 0 1-.7 1.4h-13a.9.9 0 0 1-.7-1.4z"/><path d="M10 21a2 2 0 0 0 4 0"/>'],
    ['search', 'hledat', 'a', '<circle cx="11" cy="11" r="6.5"/>', null],
    ['trash', 'koš', 'b', '<path d="M6.5 7l1 13h9l1-13z"/>', '<path d="M4.5 7h15"/><path d="M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7"/><path d="M6.5 7l.8 11.2A3 3 0 0 0 10.3 21h3.4a3 3 0 0 0 3-2.8L17.5 7"/>'],
    ['wifi', 'síť', 'a', '<path d="M5.5 12.5a9.5 9.5 0 0 1 13 0L12 19z"/>', null],
    ['volume', 'zvuk', 'a', '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>', '<path d="M4 10.5a1 1 0 0 1 1-1h2.5l3.6-3.2a.6.6 0 0 1 .9.4v10.6a.6.6 0 0 1-.9.4l-3.6-3.2H5a1 1 0 0 1-1-1z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>'],
    ['battery', 'baterie', 'b', '<rect x="2.5" y="7.5" width="17" height="9" rx="2.5"/>', null],
    ['user', 'uživatel', 'a', '<circle cx="12" cy="8.5" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0z"/>', null],
    ['lock', 'zámek', 'a', '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/>', '<rect x="5" y="10.5" width="14" height="10" rx="3.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><circle cx="12" cy="15.5" r=".9" fill="currentColor"/>'],
    ['shieldcheck', 'systém', 'a', '<path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.3-7.5 9.5-4.3-1.2-7.5-4.9-7.5-9.5V6z"/>',
      '<path d="M12 3.2l6.2 2.4a2 2 0 0 1 1.3 1.9v4c0 4.6-3.2 8.3-7.5 9.5-4.3-1.2-7.5-4.9-7.5-9.5v-4a2 2 0 0 1 1.3-1.9z"/><path d="M8.7 12.2l2.3 2.3 4.3-4.6"/>'],
    ['agent', 'agent', 'ai', '<path d="M12 3l1.8 4.6L18.5 9l-4.7 1.8L12 15.5l-1.8-4.7L5.5 9l4.7-1.4z"/>', null],
    ['camera', 'kamera', 'b', '<path d="M4 8.5A2.5 2.5 0 0 1 6.5 6H8l1.5-2h5L16 6h1.5A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/>', null],
    ['disk', 'disk', 'b', '<path d="M3 13h18v3a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/>', '<rect x="3" y="5" width="18" height="14" rx="4"/><path d="M3 13h18"/><circle cx="17" cy="16" r=".9" fill="currentColor"/>'],
    ['history', 'historie', 'a', '<circle cx="12" cy="12" r="7.5"/>', null],
    ['branch', 'zkusit bokem', 'a', '<circle cx="6" cy="5.5" r="2"/><circle cx="6" cy="18.5" r="2"/><circle cx="18" cy="8" r="2"/>', null],
    ['apps', 'aplikace', 'a', '<rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/>',
      '<rect x="4" y="4" width="6.5" height="6.5" rx="2.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2.6"/>']
  ];
  var BY = {}; I.forEach(function (i) { BY[i[0]] = i; });
  BY.globe = ['globe', 'prohlížeč', 'a', '<circle cx="12" cy="12" r="9"/>', null];
  var SW = { 16: 1.75, 24: 2, 32: 2.4, 48: 3 };
  function shape(n) { var i = BY[n]; return i && i[4] ? i[4] : sym(n); }
  function fillArea(n) { return BY[n] ? BY[n][3] : ''; }
  // D pastel: vypln pastel, kresba syta.  E dlazdice: glyf syty na pastelove dlazdici.  F prechod: vypln prechodem dvou pastelu, kresba syta.
  function icon(n, dir, size, th) {
    var c = CAT[CATOF[n] || 'system'][th], sw = (SW[size] || 2) * 24 / size, hc = th === 'contrast';
    var line = '<g fill="none" stroke="' + c[1] + '" stroke-width="' + sw.toFixed(2) + '" stroke-linecap="round" stroke-linejoin="round">' + shape(n) + '</g>';
    if (dir === 'E') {
      var tile = hc ? '<rect x=".75" y=".75" width="22.5" height="22.5" rx="7" fill="none" stroke="' + c[1] + '" stroke-width="1.5"/>' : '<rect width="24" height="24" rx="7.5" fill="' + c[0] + '"/>';
      var gsw = (sw * 1.15).toFixed(2);
      return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" role="img" aria-label="' + (BY[n] ? BY[n][1] : n) + '">' + tile +
        '<g transform="translate(5 5) scale(.5833)" fill="none" stroke="' + c[1] + '" stroke-width="' + (gsw / .5833 * .8).toFixed(2) + '" stroke-linecap="round" stroke-linejoin="round">' + shape(n) + '</g></svg>';
    }
    var fill = hc ? '' : '<g fill="' + (dir === 'F' ? 'url(#gr-' + (CATOF[n] || 'system') + '-' + th + ')' : c[0]) + '" stroke="none">' + fillArea(n) + '</g>';
    return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" role="img" aria-label="' + (BY[n] ? BY[n][1] : n) + '">' + fill + line + '</svg>';
  }
  var APPS = [['folder', 'Soubory'], ['terminal', 'Terminál'], ['settings', 'Nastavení'], ['globe', 'Prohlížeč']];
  function appIcon(a, dir, th, px) {
    var cat = CATOF[a[0]], c = CAT[cat][th], hc = th === 'contrast', s = px || 48;
    var bg = hc ? '#000' : dir === 'F' ? 'url(#gr-' + cat + '-' + th + ')' : c[0];
    var svg = '<svg viewBox="0 0 48 48" width="' + s + '" height="' + s + '" role="img" aria-label="' + a[1] + '"><rect x="1" y="1" width="46" height="46" rx="14" fill="' + bg + '"' + (hc ? ' stroke="' + c[1] + '" stroke-width="2"' : '') + '/>' +
      '<g transform="translate(10 10) scale(1.1667)" fill="none" stroke="' + c[1] + '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + shape(a[0]) + '</g></svg>';
    return px ? svg : '<figure>' + svg + a[1] + '</figure>';
  }
  function fileIcon(dir, th, kind) {
    var map = { doc: 'soubory', img: 'zarizeni', code: 'system' }, c = CAT[map[kind]][th];
    var p = '<path d="M8 3h5.6a2 2 0 0 1 1.4.6l3.4 3.4a2 2 0 0 1 .6 1.4V18a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/>';
    var f = th === 'contrast' ? '' : '<g fill="' + (dir === 'F' ? 'url(#gr-' + map[kind] + '-' + th + ')' : c[0]) + '">' + p + '</g>';
    if (dir === 'E') return '<svg viewBox="0 0 24 24" width="20" height="20"><rect width="24" height="24" rx="7.5" fill="' + (th === 'contrast' ? 'none' : c[0]) + '"' + (th === 'contrast' ? ' stroke="' + c[1] + '" stroke-width="1.5"' : '') + '/><g transform="translate(5 5) scale(.5833)" fill="none" stroke="' + c[1] + '" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">' + p + '<path d="M14 3.5V7a1.5 1.5 0 0 0 1.5 1.5H19"/></g></svg>';
    return '<svg viewBox="0 0 24 24" width="20" height="20">' + f + '<g fill="none" stroke="' + c[1] + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '<path d="M14 3.5V7a1.5 1.5 0 0 0 1.5 1.5H19"/></g></svg>';
  }
  function context(dir, th) {
    var b = function (n, on) { return '<span class="b' + (on ? ' on' : '') + '">' + icon(n, dir, 24, th) + '</span>'; };
    var bar = '<div class="ctx-bar">' + b('apps') + '<span class="sep"></span>' + APPS.slice(0, 3).map(function (a) { return '<span class="b">' + appIcon(a, dir, th, 28) + '</span>'; }).join('') +
      '<span class="sp"></span>' + b('tasks') + b('wifi') + b('volume') + b('battery') + b('bell') + '</div>';
    var title = '<div class="ctx-title"><span class="badge"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' + shape('shieldcheck') + '</svg>Soubory</span><span class="nm">Dokumenty</span></div>';
    var rows = [['folder', 'Projekty', '-', 1], ['folder', 'Faktury', '-', 0], ['doc', 'smlouva.pdf', '412 kB', 0], ['img', 'dovolena.jpg', '3,1 MB', 0], ['code', 'main.rs', '12 kB', 0]];
    return bar + title + '<div class="ctx-list">' + rows.map(function (r) {
      return '<div class="r' + (r[3] ? ' sel' : '') + '">' + (r[0] === 'folder' ? icon('folder', dir, 20, th) : fileIcon(dir, th, r[0])) + r[1] + '<span class="m">' + r[2] + '</span></div>';
    }).join('') + '</div>';
  }
  var DIRS = [
    { id: 'D', name: 'D - Pastel', lead: 'Měkký tvar, pastelová výplň a kresba v sytém odstínu téže barvy (ne černá). Barva podle kategorie, takže lišta i seznam souborů mají řád: soubory máslové, systém levandulový, síť nebeská, zařízení mátová, čas tyrkysový.',
      why: ['Výrazně vřelejší než linka, ale pořád „kresba“, ne pouťová ikona.', 'Kategorie se dají naučit: barva napoví, co ikona dělá, ještě než ji přečteš.', 'Sytá kresba drží kontrast proti pozadí (3 : 1), pastel jen zjemňuje.'],
      risk: ['Na pastelovém výběru (accent_soft) levandulové ikony splývají: u vybraného řádku kreslit výplň o stupeň sytější.', 'Kategorie musí být pevné a popsané, jinak vznikne náhodná duha.', 'Při 16 px je výplň jen skvrna: master 16 px s menší výplní.'] },
    { id: 'E', name: 'E - Pastelové dlaždice', lead: 'Glyf v sytém odstínu na zaoblené pastelové dlaždici, jako barevné štítky. Každá ikona má stejně velký „podklad“, takže řady ikon vypadají uspořádaně a barevně zároveň.',
      why: ['Nejbarevnější a nejčitelnější: dlaždice dává ikoně vlastní plochu a kontrast.', 'Stejný tvar dlaždic = klidná mřížka i při mnoha barvách (nastavení, spouštěč, seznamy).', 'Ikony aplikací i systému mluví stejným jazykem.'],
      risk: ['V liště a titulku zabere dlaždice víc místa; na 16 px je glyf malý (14 px uvnitř). Pro 16 px použít D bez dlaždice.', 'Hodně dlaždic vedle sebe může působit těžce: v hustých seznamech jen u typů souborů.', 'Ve vysokém kontrastu dlaždice jen jako rám.'] },
    { id: 'F', name: 'F - Pastelový přechod', lead: 'Jako D, ale výplň je jemný přechod dvou sousedních pastelů (máslová do nebeské, levandulová do nebeské, mátová do tyrkysové). Kresba sytá. Působí „živě“, jako světlo na tvaru, ne jako barvy navíc.',
      why: ['Nejzajímavější a nejosobitější z barevných směrů, přechody ladí s pozadím plochy (také přechod).', 'Pořád dvě barvy příbuzné, žádná duha.', 'Ikony aplikací vypadají prémiově i bez detailů.'],
      risk: ['Přechod musí kreslit rasterizér (libs/gfx: lineární gradient ve výplni cesty).', 'Při 16 px přechod zanikne, vypadá jako D (to nevadí).', 'Na tmavém motivu jsou přechody tmavé a tlumené, sytá kresba nese tvar.'] }
  ];
  var TH = [['light', 'Světlý'], ['dark', 'Tmavý'], ['contrast', 'Vysoký kontrast']];
  document.getElementById('dirs').innerHTML = DIRS.map(function (d) {
    return '<section class="dir" aria-labelledby="h' + d.id + '"><h2 id="h' + d.id + '">' + d.name + '</h2><p class="lead">' + d.lead + '</p>' +
      '<div class="why"><div class="card"><h3>Proč</h3><ul>' + d.why.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>' +
      '<div class="card"><h3>Rizika</h3><ul>' + d.risk.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div></div>' +
      '<div class="themes">' + TH.map(function (t) {
        return '<div class="panel th-' + t[0] + '"><h4>' + t[1] + '</h4><div class="igrid">' + I.map(function (i) { return '<div>' + icon(i[0], d.id, 24, t[0]) + i[1] + '</div>'; }).join('') + '</div>' +
          '<div class="sizes">' + [16, 24, 32, 48].map(function (s) { return icon('folder', d.id, s, t[0]); }).join('') + [16, 24, 32, 48].map(function (s) { return icon('settings', d.id, s, t[0]); }).join('') + '<span class="note" style="margin:0 0 0 auto;font-size:10px">16 / 24 / 32 / 48</span></div>' +
          '<div class="apps">' + APPS.map(function (a) { return appIcon(a, d.id, t[0]); }).join('') + '</div>' + context(d.id, t[0]) + '</div>';
      }).join('') + '</div></section>';
  }).join('');
});
</script>
</body>
</html>
