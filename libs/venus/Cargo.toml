[package]
name = "venus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vlastni klient Venus: serializace Vulkanu pro virtio-gpu (generovano z vk.xml) a pripojeni k render uzlu"

[features]
# Klient nad kanalem render uzlu (jen v systemu, ne na hostiteli).
os = ["dep:libos", "dep:renderproto"]

[dependencies]
renderproto = { path = "../renderproto", optional = true }
libos = { path = "../libos", optional = true }
