[package]
name = "fsproto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Protokol souboroveho systemu (klient <-> fsd)"

[features]
rustc-dep-of-std = ["dep:core", "dep:alloc", "libos/rustc-dep-of-std", "wire/rustc-dep-of-std", "svcclient/rustc-dep-of-std"]

[dependencies]
# Preklad jako zavislost std (cil magnumopus, viz docs/cs/rust-std.md).
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
alloc = { version = "1.0.0", optional = true, package = "rustc-std-workspace-alloc" }
libos = { path = "../libos", default-features = false }
wire = { path = "../wire" }
svcclient = { path = "../svcclient", features = ["client"] }
