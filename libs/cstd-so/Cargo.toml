[package]
name = "cstd-so"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Sdilena knihovna C libc.so (cstd + std + osrt jako PIC) pro programy PIE v C"

[lib]
# Vystup libc.so (SONAME libc.so, xtask stdsys::build_libc_so_locked).
# Preklada se jen pro cil *-unknown-magnumopus-dyn (std jako PIC).
name = "c"
crate-type = ["cdylib"]
test = false

[dependencies]
cstd = { path = "../cstd" }
# Objekty jadra pro programy v C (magnumopus/sys.h): ffdec nad libc.so.
mosys = { path = "../mosys" }
# Vic oken kompozitoru (`mowin_*`): unixova cast ovladace grafiky Wine
# (winemo.so) je knihovna nad libc.so.
mowin = { path = "../mowin" }
