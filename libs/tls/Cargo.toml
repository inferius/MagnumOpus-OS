[package]
name = "tls"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Klient TLS 1.3: rustls s kryptografii RustCrypto (bez std)"

[features]
default = []
# Platforma libos (nahoda a cas z jadra).
libos = ["dep:libos"]

[dependencies]
abi = { workspace = true }
netproto = { path = "../netproto" }
libos = { path = "../libos", optional = true }
spin = "0.12"
# SHA-1 jen pro identifikator certifikatu v OCSP (CertID), ne pro podpisy.
sha1 = { version = "0.10", default-features = false, features = ["force-soft"] }
rustls = { version = "0.23.40", default-features = false }
pki-types = { package = "rustls-pki-types", version = "1.14", default-features = false, features = ["alloc"] }
# force-soft: bez SIMD a bez detekce instrukci za behu (cile bez FPU/SSE).
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
hmac = { version = "0.12", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
chacha20poly1305 = { version = "0.10", default-features = false }
aead = { version = "0.5", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "arithmetic"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "arithmetic"] }
ed25519-dalek = { version = "2", default-features = false }
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
signature = { version = "2", default-features = false }
rand_core = { version = "0.6", default-features = false }

# Testy na hostiteli: nezavisly server (rustls + ring) a testovaci CA (rcgen).
[dev-dependencies]
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std"] }
ring = "0.17"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
