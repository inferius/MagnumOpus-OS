[package]
name = "mosdl"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Rozhrani C pro port SDL (okno, snimek, udalosti) nad oknem z libs/ui; soucast libc.a"

[lib]
# Preklad udalosti a kontrola snimku se testuji na hostiteli; symboly C
# a okno jen na cili magnumopus.
test = true

[dependencies]
guiproto = { path = "../guiproto" }
# Spolecne udalosti a kopie snimku (libs/mowin/src/event.rs).
mowin = { path = "../mowin" }
inputproto = { path = "../inputproto" }

[target.'cfg(target_os = "magnumopus")'.dependencies]
# Bez `rt`: vstupni bod, heap a vlakna dava std (osrt).
libos = { path = "../libos", default-features = false }
ui = { path = "../ui", features = ["os"] }
gfx = { path = "../gfx" }
clipproto = { path = "../clipproto" }
audioproto = { path = "../audioproto", features = ["client"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("magnumopus"))'] }
