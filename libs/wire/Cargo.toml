[package]
name = "wire"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spolecne kodovani zprav protokolu (fsproto, netproto)"

[features]
rustc-dep-of-std = ["dep:core", "dep:alloc", "abi/rustc-dep-of-std"]

[dependencies]
# Preklad jako zavislost std (cil magnumopus, viz docs/cs/rust-std.md).
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
alloc = { version = "1.0.0", optional = true, package = "rustc-std-workspace-alloc" }
abi = { workspace = true }
