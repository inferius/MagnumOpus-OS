[package]
name = "comp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Jadro kompozitoru: okna, strom vrstev, transakce, takt snimku, skladani, vstup, systemove dialogy, akce"

[features]
default = []
# Rezim vyvojare v liste (`src/devmode.rs`): jen vyvojove sestaveni,
# zapina ho xtask pro obrazy s vyvojovym profilem.
dev-mode = ["guiproto/dev-mode"]

[dependencies]
guiproto = { path = "../guiproto" }
clipproto = { path = "../clipproto" }
inputproto = { path = "../inputproto" }
gfx = { path = "../gfx" }
theme = { path = "../theme" }
# Systemove pohledy (paleta, spoustec) nad knihovnou komponent (bez os).
ui = { path = "../ui" }
# Vychod a zapad slunce (sin, cos, acos bez std; `src/sun.rs`).
libm = "0.2.16"

[dev-dependencies]
# Testy kresli skutecnym Interem (snimky pro porovnani s prototypem).
font = { path = "../font", features = ["inter-400", "inter-500", "inter-600", "inter-700"] }
vkcomp = { path = "../vkcomp" }
