[package]
name = "audioproto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Protokol zvuku (aplikace <-> audiod, audiod <-> ovladac zvukove karty)"

[features]
# Klientska knihovna nad kanaly (AudioClient, Stream); zapina ji, kdo ji
# pouziva (shell, testy, aplikace). Bez ni zustanou jen formaty zprav
# a sdileny kruhovy buffer - ty jdou testovat na hostiteli.
default = []
client = ["dep:libos", "dep:svcclient"]

[dependencies]
abi = { workspace = true }
wire = { path = "../wire" }
# Bez `rt`: programy no_std maji libos primo, programy se std (SDL pres
# `mosdl`) ho maji od std.
libos = { path = "../libos", optional = true, default-features = false }
svcclient = { path = "../svcclient", features = ["client"], optional = true }
