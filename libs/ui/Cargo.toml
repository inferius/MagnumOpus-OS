[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nativni knihovna UI: deklarativni prvky, rozvrzeni, kresleni, vstup, strom vrstev a pristupnosti"

[features]
# Behove prostredi pro aplikace v OS (kanal ke kompozitoru, VMO bufferu).
os = ["dep:libos", "dep:svcclient"]

[dependencies]
guiproto = { path = "../guiproto" }
gfx = { path = "../gfx" }
theme = { path = "../theme" }
# Rezy Interu, ktere prvky kresli (text 400, tlacitko 500 -> 400, tucne 600,
# nadpis 650 -> 700); kazdy rez ~0,4 MB v programu.
font = { path = "../font", features = ["inter-400", "inter-600", "inter-700"] }
inputproto = { path = "../inputproto" }
libos = { path = "../libos", optional = true }
# Obnova okna po padu kompozitoru (listek k supervisoru).
svcclient = { path = "../svcclient", features = ["client"], optional = true }
