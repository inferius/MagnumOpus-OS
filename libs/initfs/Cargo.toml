[package]
name = "initfs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Format initfs: cteni (no_std) a zapis (feature std, pro xtask)"

[features]
rustc-dep-of-std = ["dep:core"]
std = []

[dependencies]
# Preklad jako zavislost std (cil magnumopus, viz docs/cs/rust-std.md).
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
