[package]
name = "term"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chytry terminal: nativni protokol, sluzba relaci, adapter VT100, obrazovka s pismem"

[features]
default = []
# Prikaz `devmode` (rezim vyvojare): jen vyvojove sestaveni, zapina ho
# xtask pro obrazy s vyvojovym profilem.
dev-mode = ["shlang/dev-mode"]

[dependencies]
abi.workspace = true
shlang = { path = "../shlang" }
spin = "0.12"
taskproto = { path = "../taskproto" }
noto-sans-mono-bitmap = { version = "0.4", default-features = false, features = ["regular", "size_16", "size_24", "unicode-basic-latin", "unicode-latin-1-supplement", "unicode-latin-extended-a", "unicode-specials"] }

[dev-dependencies]
# Test pilulky slozky (`tests_pill.rs`): skutecne pismo UI, jako okno GUI.
gfx = { path = "../gfx" }
ui = { path = "../ui" }
theme = { path = "../theme" }
taskcore = { path = "../taskcore" }
installplan = { path = "../installplan" }
