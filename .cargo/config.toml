[alias]
xtask = "run --quiet --package xtask --"

# Kernel: staticky (ne-PIE) ELF linkovany do horni casti adresniho prostoru,
# viz kernel/linker.ld. code-model=kernel = symboly v poslednich 2 GiB.
[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
    "-C", "force-frame-pointers=yes",
]

# Kostra jadra pro aarch64 (zatim jen kontrola prekladu, `cargo xtask check
# --arch aarch64`). Kod jadra je pozicne zavisly jako na x86_64; model kodu
# "small" (vychozi) staci, protoze adresy jsou relativni k PC (+/- 4 GiB).
# Cil "softfloat": jadro nesmi pouzivat registry FPU/SIMD (jako x86_64 bez
# SSE), protoze stav FPU programu se uklada jen pri prepnuti vlakna.
[target.aarch64-unknown-none-softfloat]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "force-frame-pointers=yes",
]
